name: Hay Star CI & Release Build

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-loader:
    name: Build Rust Standalone Loader (Windows x86_64)
    runs-on: windows-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Rust Toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: loader -> target

      - name: Build hay-star.exe (Release)
        run: |
          cd loader
          cargo build --release --locked

      - name: Upload Binary Artifact
        uses: actions/upload-artifact@v4
        with:
          name: hay-star-windows-x64
          path: target/release/hay-star.exe
